[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waternilm"
version = "0.1.0"
description = "Research water disaggregation from appliance electrical states"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
waternilm = "waternilm.__main__:main"

[tool.setuptools.packages.find]
include = ["waternilm*"]
